[project]
name = "assister"
version = "0.1.0"
description = "바탕화면 AI 친구 - Windows 바탕화면에 떠 있는 2D 캐릭터 도우미"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8",
    "comtypes>=1.4.17",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pillow>=11",
    "sounddevice>=0.5.6",
]

[project.scripts]
assister = "assister.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assister"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 실수를 잡는 규칙만 켠다: 안 쓰는 이름, 문법 오류, 흔한 버그, 낡은 문법, 줄일 수 있는 코드
select = ["F", "E9", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
